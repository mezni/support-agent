[project]
name = "support-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
support-agent = "support_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
